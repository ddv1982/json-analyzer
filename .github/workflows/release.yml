name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/${TAG_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing release notes: $NOTES_FILE" >&2
            exit 1
          fi

          TITLE="$(head -n 1 "$NOTES_FILE" | sed 's/^# //')"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG_NAME" --title "$TITLE" --notes-file "$NOTES_FILE" --verify-tag
          fi

  build-bundles:
    name: Build ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-22.04
          - label: macOS
            os: macos-latest
          - label: Windows
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk usage after cleanup:"
          df -h

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          key: rust-${{ runner.os }}-release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundles
        shell: bash
        run: pnpm exec tauri build --config '{"bundle":{"active":true}}' --no-sign

      - name: Upload bundle assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s globstar nullglob
          files=(
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bundle assets found under src-tauri/target/release/bundle" >&2
            find src-tauri/target/release/bundle -maxdepth 5 -type f || true
            exit 1
          fi

          gh release upload "$TAG_NAME" "${files[@]}" --clobber
