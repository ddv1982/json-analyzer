name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FRONTEND_DIST_ARTIFACT_NAME: json-analyzer-frontend-dist
  RELEASE_ARTIFACT_NAME: json-analyzer-linux-x86_64-release-bundle

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-22.04
    outputs:
      ci_run_id: ${{ steps.wait_for_ci.outputs.ci_run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${TAG_NAME}.md"
          if [ ! -f "${notes_file}" ]; then
            echo "Missing release notes: ${notes_file}" >&2
            exit 1
          fi
          first_line="$(head -n 1 "${notes_file}")"
          case "${first_line}" in
            "# "?*)
              ;;
            *)
              echo "Release notes must start with a markdown H1 title." >&2
              exit 1
              ;;
          esac
          title="${first_line#\# }"
          if [ -z "${title}" ]; then
            echo "Release notes must start with a markdown H1 title." >&2
            exit 1
          fi

      - name: Wait for CI on tagged commit
        id: wait_for_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAGGED_SHA: ${{ github.sha }}
          RELEASE_ARTIFACT_NAME: ${{ env.RELEASE_ARTIFACT_NAME }}
          FRONTEND_DIST_ARTIFACT_NAME: ${{ env.FRONTEND_DIST_ARTIFACT_NAME }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))

          while [ "$SECONDS" -lt "$deadline" ]; do
            run_json="$(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${TAGGED_SHA}&event=push&per_page=20")"
            run_state="$(printf '%s' "$run_json" | python3 -c "import json, sys; runs = json.load(sys.stdin).get('workflow_runs', []); match = next((run for run in runs if run.get('name') == 'CI' and run.get('head_branch') == 'main'), None); print('' if match is None else f\"{match.get('id', '')}\\t{match.get('status', '')}\\t{match.get('conclusion') or ''}\\t{match.get('html_url', '')}\")")"

            if [ -z "$run_state" ]; then
              echo "Waiting for CI run for commit ${TAGGED_SHA} to appear..."
              sleep 20
              continue
            fi

            run_id="${run_state%%$'\t'*}"
            remainder="${run_state#*$'\t'}"
            status="${remainder%%$'\t'*}"
            remainder="${remainder#*$'\t'}"
            conclusion="${remainder%%$'\t'*}"
            run_url="${remainder#*$'\t'}"

            echo "Observed CI run status: ${status:-unknown} ${conclusion:-}"

            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              for artifact_name in "$RELEASE_ARTIFACT_NAME" "$FRONTEND_DIST_ARTIFACT_NAME"; do
                artifact_count="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?name=${artifact_name}" --jq '[.artifacts[] | select(.expired == false)] | length')"
                if [ "$artifact_count" -eq 0 ]; then
                  echo "CI succeeded for ${TAGGED_SHA} but did not publish a non-expired artifact named ${artifact_name}." >&2
                  exit 1
                fi
              done

              echo "ci_run_id=${run_id}" >> "$GITHUB_OUTPUT"
              echo "CI succeeded for ${TAGGED_SHA}: ${run_url}"
              exit 0
            fi

            if [ "$status" = "completed" ]; then
              echo "CI did not succeed for ${TAGGED_SHA}: ${run_url}" >&2
              exit 1
            fi

            sleep 20
          done

          echo "Timed out waiting for CI to finish for ${TAGGED_SHA}." >&2
          exit 1

  create-release:
    name: Create Draft Release
    needs: validate-release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${TAG_NAME}.md"
          title="$(head -n 1 "${notes_file}" | sed 's/^# //')"

          if gh release view "${TAG_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --notes-file "${notes_file}" \
              --draft=true \
              --prerelease=false
          else
            gh release create "${TAG_NAME}" \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --notes-file "${notes_file}" \
              --draft \
              --prerelease=false \
              --verify-tag
          fi

  publish-linux-assets:
    name: Publish Linux Release Assets
    needs: [validate-release, create-release]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download reusable Tauri bundle artifact from CI
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-release.outputs.ci_run_id }}
          path: release-artifacts

      - name: Install Linux signature and metadata validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream cpio desktop-file-utils dpkg-sig gnupg rpm rpm2cpio

      - name: Verify Debian package signatures
        if: vars.ENABLE_DEB_SIGNING == 'true'
        env:
          DEB_SIGNING_PUBLIC_KEY: ${{ vars.DEB_SIGNING_PUBLIC_KEY }}
          DEB_SIGNING_KEY_FINGERPRINT: ${{ secrets.DEB_SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${DEB_SIGNING_PUBLIC_KEY}" ] || missing+=("DEB_SIGNING_PUBLIC_KEY repository variable")
          [ -n "${DEB_SIGNING_KEY_FINGERPRINT}" ] || missing+=("DEB_SIGNING_KEY_FINGERPRINT")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Required Debian signature verification inputs are missing: ${missing[*]}" >&2
            exit 1
          fi

          shopt -s globstar nullglob
          deb_packages=(release-artifacts/**/*.deb)
          if [ ${#deb_packages[@]} -eq 0 ]; then
            echo "No Debian packages found under release-artifacts." >&2
            exit 1
          fi

          gnupg_home="$(mktemp -d)"
          public_key_file="$(mktemp)"
          cleanup() {
            rm -rf "${gnupg_home}"
            rm -f "${public_key_file}"
          }
          trap cleanup EXIT

          chmod 700 "${gnupg_home}"
          export GNUPGHOME="${gnupg_home}"

          printf '%s' "${DEB_SIGNING_PUBLIC_KEY}" | base64 --decode > "${public_key_file}"
          gpg --batch --import "${public_key_file}"

          expected_fingerprint="$(printf '%s' "${DEB_SIGNING_KEY_FINGERPRINT}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          imported_fingerprint="$(gpg --batch --with-colons --fingerprint "${expected_fingerprint}" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"

          if [ "${imported_fingerprint}" != "${expected_fingerprint}" ]; then
            echo "Imported Debian signing public key fingerprint did not match DEB_SIGNING_KEY_FINGERPRINT." >&2
            exit 1
          fi

          for deb in "${deb_packages[@]}"; do
            echo "Verifying ${deb}"
            python3 scripts/verify_deb_signature.py \
              --public-key "${public_key_file}" \
              --fingerprint "${expected_fingerprint}" \
              --role builder \
              "${deb}"
          done

      - name: Validate Debian package metadata
        run: python3 scripts/validate_linux_package_metadata.py "release-artifacts/**/*.deb"

      - name: Validate RPM package metadata
        run: python3 scripts/validate_linux_package_metadata.py "release-artifacts/**/*.rpm"

      - name: Build signed APT repository
        env:
          APT_REPO_SIGNING_PRIVATE_KEY: ${{ secrets.APT_REPO_SIGNING_PRIVATE_KEY }}
          APT_REPO_SIGNING_KEY_FINGERPRINT: ${{ secrets.APT_REPO_SIGNING_KEY_FINGERPRINT }}
          APT_REPO_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_REPO_SIGNING_KEY_PASSPHRASE }}
          DEB_SIGNING_PRIVATE_KEY: ${{ secrets.DEB_SIGNING_PRIVATE_KEY }}
          DEB_SIGNING_KEY_FINGERPRINT: ${{ secrets.DEB_SIGNING_KEY_FINGERPRINT }}
          DEB_SIGNING_KEY_PASSPHRASE: ${{ secrets.DEB_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          signing_private_key="${APT_REPO_SIGNING_PRIVATE_KEY}"
          signing_fingerprint="${APT_REPO_SIGNING_KEY_FINGERPRINT}"
          signing_passphrase="${APT_REPO_SIGNING_KEY_PASSPHRASE}"
          signing_source="APT repository signing key"

          if [ -z "${signing_private_key}" ] && [ -z "${signing_fingerprint}" ]; then
            signing_private_key="${DEB_SIGNING_PRIVATE_KEY}"
            signing_fingerprint="${DEB_SIGNING_KEY_FINGERPRINT}"
            signing_passphrase="${DEB_SIGNING_KEY_PASSPHRASE}"
            signing_source="Debian package signing key fallback"
          fi

          missing=()
          [ -n "${signing_private_key}" ] || missing+=("APT_REPO_SIGNING_PRIVATE_KEY or DEB_SIGNING_PRIVATE_KEY")
          [ -n "${signing_fingerprint}" ] || missing+=("APT_REPO_SIGNING_KEY_FINGERPRINT or DEB_SIGNING_KEY_FINGERPRINT")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Required APT repository signing inputs are missing: ${missing[*]}" >&2
            exit 1
          fi
          echo "Using ${signing_source} for APT repository Release signing."

          deb_packages=(release-artifacts/**/*.deb)
          if [ ${#deb_packages[@]} -eq 0 ]; then
            echo "No Debian packages found under release-artifacts." >&2
            exit 1
          fi

          gnupg_home="$(mktemp -d)"
          verification_home="$(mktemp -d)"
          key_file="$(mktemp)"
          passphrase_file=""
          setup_extract_dir=""
          cleanup() {
            rm -rf "${gnupg_home}"
            rm -rf "${verification_home}"
            rm -f "${key_file}"
            if [ -n "${passphrase_file}" ]; then
              rm -f "${passphrase_file}"
            fi
            if [ -n "${setup_extract_dir}" ]; then
              rm -rf "${setup_extract_dir}"
            fi
          }
          trap cleanup EXIT

          chmod 700 "${gnupg_home}"
          export GNUPGHOME="${gnupg_home}"
          echo allow-loopback-pinentry > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent || true

          printf '%s' "${signing_private_key}" | base64 --decode > "${key_file}"
          gpg --batch --import "${key_file}"

          expected_fingerprint="$(printf '%s' "${signing_fingerprint}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          imported_fingerprint="$(gpg --batch --with-colons --fingerprint "${expected_fingerprint}" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"

          if [ "${imported_fingerprint}" != "${expected_fingerprint}" ]; then
            echo "Imported APT repository signing key fingerprint did not match the selected signing fingerprint." >&2
            exit 1
          fi

          passphrase_args=()
          gpg_passphrase_options=()
          if [ -n "${signing_passphrase}" ]; then
            passphrase_file="$(mktemp)"
            chmod 600 "${passphrase_file}"
            printf '%s' "${signing_passphrase}" > "${passphrase_file}"
            passphrase_args=(--gpg-passphrase-file "${passphrase_file}")
            gpg_passphrase_options=(--passphrase-file "${passphrase_file}")
          fi

          setup_package="json-analyzer-repository-setup_1.0_all.deb"
          python3 scripts/build_apt_repository.py \
            --clean \
            --output apt-repository \
            --suite stable \
            --repository-url "https://ddv1982.github.io/json-analyzer/apt/" \
            --gpg-homedir "${gnupg_home}" \
            --gpg-key "${expected_fingerprint}" \
            --public-key-out apt-repository/json-analyzer-archive-keyring.pgp \
            --setup-package-out "${setup_package}" \
            "${passphrase_args[@]}" \
            "${deb_packages[@]}"

          EXPECTED_FINGERPRINT="${expected_fingerprint}" python3 <<'PY'
          import os
          import pathlib

          fingerprint = os.environ["EXPECTED_FINGERPRINT"]
          script_path = pathlib.Path("scripts/install-apt-repo.sh")
          script = script_path.read_text(encoding="utf-8")
          placeholder = "__JSON_ANALYZER_APT_SIGNING_KEY_FINGERPRINT__"
          if placeholder not in script:
              raise SystemExit(f"missing installer fingerprint placeholder {placeholder}")
          script_path.write_text(script.replace(placeholder, fingerprint), encoding="utf-8")
          PY

          sha256sum "${setup_package}" > "${setup_package}.sha256"
          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --homedir "${gnupg_home}" \
            --local-user "${expected_fingerprint}" \
            "${gpg_passphrase_options[@]}" \
            --armor \
            --detach-sign \
            --output "${setup_package}.sha256.asc" \
            "${setup_package}.sha256"

          test "$(dpkg-deb --field "${setup_package}" Package)" = "json-analyzer-repository-setup"
          test "$(dpkg-deb --field "${setup_package}" Version)" = "1.0"
          test "$(dpkg-deb --field "${setup_package}" Architecture)" = "all"
          setup_extract_dir="$(mktemp -d)"
          dpkg-deb -x "${setup_package}" "${setup_extract_dir}"
          test -s "${setup_extract_dir}/usr/share/keyrings/json-analyzer-archive-keyring.pgp"
          grep -Fx "Types: deb" "${setup_extract_dir}/etc/apt/sources.list.d/json-analyzer.sources"
          grep -Fx "URIs: https://ddv1982.github.io/json-analyzer/apt/" "${setup_extract_dir}/etc/apt/sources.list.d/json-analyzer.sources"
          grep -Fx "Suites: stable" "${setup_extract_dir}/etc/apt/sources.list.d/json-analyzer.sources"
          grep -Fx "Components: main" "${setup_extract_dir}/etc/apt/sources.list.d/json-analyzer.sources"
          grep -E '^Architectures: .*amd64( |$)' "${setup_extract_dir}/etc/apt/sources.list.d/json-analyzer.sources"
          grep -Fx "Signed-By: /usr/share/keyrings/json-analyzer-archive-keyring.pgp" "${setup_extract_dir}/etc/apt/sources.list.d/json-analyzer.sources"
          sh -n scripts/install-apt-repo.sh
          ! grep -F "__JSON_ANALYZER_APT_SIGNING_KEY_FINGERPRINT__" scripts/install-apt-repo.sh

          chmod 700 "${verification_home}"
          GNUPGHOME="${verification_home}" gpg --batch --import apt-repository/json-analyzer-archive-keyring.pgp
          GNUPGHOME="${verification_home}" gpg --batch --verify apt-repository/dists/stable/InRelease
          GNUPGHOME="${verification_home}" gpg --batch --verify \
            apt-repository/dists/stable/Release.gpg \
            apt-repository/dists/stable/Release
          GNUPGHOME="${verification_home}" gpg --batch --verify \
            "${setup_package}.sha256.asc" \
            "${setup_package}.sha256"

          mkdir -p pages-site/apt
          cp -a apt-repository/. pages-site/apt/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload APT repository Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Deploy APT repository to GitHub Pages
        id: deploy_apt_pages
        uses: actions/deploy-pages@v4

      - name: Upload Linux packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.AppImage
            json-analyzer-repository-setup_*.deb
            json-analyzer-repository-setup_*.deb.sha256
            json-analyzer-repository-setup_*.deb.sha256.asc
            scripts/install-apt-repo.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos-assets:
    name: Publish macOS Release Assets
    needs: [validate-release, create-release]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          key: rust-${{ runner.os }}-release-${{ matrix.target }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Apple signing secrets
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_SECRET: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD_SECRET: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [ -n "${APPLE_CERTIFICATE_SECRET}" ] || missing+=("APPLE_CERTIFICATE")
          [ -n "${APPLE_CERTIFICATE_PASSWORD_SECRET}" ] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [ -n "${KEYCHAIN_PASSWORD_SECRET}" ] || missing+=("KEYCHAIN_PASSWORD")
          [ -n "${APPLE_API_ISSUER_SECRET}" ] || missing+=("APPLE_API_ISSUER")
          [ -n "${APPLE_API_KEY_SECRET}" ] || missing+=("APPLE_API_KEY")
          [ -n "${APPLE_API_PRIVATE_KEY_SECRET}" ] || missing+=("APPLE_API_PRIVATE_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Required macOS signing/notarization secrets are missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Import Apple signing certificate
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import base64
          import os
          import pathlib

          pathlib.Path("certificate.p12").write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE"])
          )
          PY

          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            build.keychain
          security list-keychains -d user -s \
            build.keychain \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain

          cert_id="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "${cert_id}" ]; then
            echo "No Developer ID Application signing identity was imported." >&2
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=${cert_id}" >> "${GITHUB_ENV}"
          rm -f certificate.p12

      - name: Prepare App Store Connect API key
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import base64
          import os
          import pathlib

          key_path = pathlib.Path(f"AuthKey_{os.environ['APPLE_API_KEY']}.p8")
          key_path.write_bytes(base64.b64decode(os.environ["APPLE_API_PRIVATE_KEY"]))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"APPLE_API_KEY_PATH={key_path.resolve()}\n")
          PY

      - name: Download frontend dist artifact from CI
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.FRONTEND_DIST_ARTIFACT_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-release.outputs.ci_run_id }}
          path: frontend/dist

      - name: Build unsigned Tauri macOS bundle
        if: vars.ENABLE_MACOS_SIGNING != 'true'
        env:
          JSON_ANALYZER_USE_PREBUILT_FRONTEND: '1'
        run: |
          rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"
          pnpm exec tauri build \
            --target "${{ matrix.target }}" \
            --config '{"bundle":{"active":true}}' \
            --no-sign

      - name: Build signed and notarized Tauri macOS bundle
        if: vars.ENABLE_MACOS_SIGNING == 'true'
        env:
          JSON_ANALYZER_USE_PREBUILT_FRONTEND: '1'
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"
          pnpm exec tauri build \
            --target "${{ matrix.target }}" \
            --config '{"bundle":{"active":true}}'

      - name: Upload macOS package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    needs: [create-release, publish-linux-assets, publish-macos-assets]
    runs-on: ubuntu-22.04

    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --prerelease=false
